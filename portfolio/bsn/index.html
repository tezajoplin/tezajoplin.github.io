<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BSN — Portfolio — Teza Joplin</title>
  <meta name="description" content="Case study: BSN. Coming soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #121110;
      --bg2: #1a1917;
      --border: rgba(255,255,255,0.08);
      --text: #f0ede8;
      --muted: #a8a49e;
      --dim: #5a5650;
      --accent: #c8b89a;
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      line-height: 1.6;
    }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 1.25rem 2.5rem;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(18,17,16,0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo { font-family: 'DM Serif Display', serif; font-size: 1.1rem; color: var(--text); text-decoration: none; }
    .nav-links { display: flex; gap: 0.25rem; list-style: none; }
    .nav-links a {
      color: var(--text); text-decoration: none; font-size: 0.75rem;
      letter-spacing: 0.12em; text-transform: uppercase;
      padding: 0.4rem 0.9rem; border-radius: 2px; background: rgba(255,255,255,0.05);
    }
    .nav-links a.active { color: var(--accent); background: rgba(200,184,154,0.1); }
    .nav-links a:hover { color: var(--text); background: rgba(255,255,255,0.1); }

    .breadcrumb {
      padding: 8rem 2.5rem 0;
      font-size: 0.75rem;
      color: var(--dim);
      letter-spacing: 0.05em;
    }
    .breadcrumb a { color: var(--dim); text-decoration: none; }
    .breadcrumb a:hover { color: var(--accent); }

    .stub {
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 2rem 2.5rem 8rem;
      max-width: 700px;
    }
    .stub-label {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1rem;
    }
    .stub h1 {
      font-family: 'DM Serif Display', serif;
      font-weight: 400;
      font-size: clamp(2.2rem, 5vw, 3.2rem);
      margin-bottom: 1.25rem;
    }
    .stub p { color: var(--muted); font-size: 0.95rem; line-height: 1.8; }

    footer {
      padding: 2.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--dim);
    }
    footer a { color: var(--dim); text-decoration: none; }
    footer a:hover { color: var(--accent); }

    @media (max-width: 760px) { .nav-links { display: none; } }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="nav-logo">TJ</a>
    <ul class="nav-links">
      <li><a href="/#work">Work</a></li>
      <li><a href="/portfolio/" class="active">Portfolio</a></li>
      <li><a href="/#life">Life</a></li>
      <li><a href="/#blog">Blog</a></li>
      <li><a href="/#about">About</a></li>
      <li><a href="/Teza-Joplin-Resume.pdf" download class="nav-cv">Resume</a></li>
    </ul>
  </nav>

  <p class="breadcrumb"><a href="/portfolio/">Portfolio</a> / BSN</p>

  <section class="stub">
    <div class="stub-label">Case Study</div>
    <h1>BSN</h1>
    <p>This case study is still being written. Come back soon for the full story, context, what was built, and the results.</p>
  </section>

  <footer>
    <span>© 2026 Teza Joplin Paelongan</span>
    <a href="/portfolio/">← Back to Portfolio</a>
  </footer>

</body>
</html>
